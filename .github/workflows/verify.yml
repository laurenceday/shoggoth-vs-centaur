name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check evidence and document shape
        run: python3 scripts/check_repository.py
      - name: Run Elenchus-compatible suite
        run: python3 scripts/run_tests.py --report .elenchus/shoggoth-vs-centaur-step-3.json
      - name: Run standard unittest discovery
        run: python3 -m unittest discover -s tests
